name: Test by Deno

permissions:
    contents: read

on:
    push:
        branches: [main]
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Git Checkout
              uses: actions/checkout@v6
            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "24"
            # - name: Lint Deno Module
            #   run: deno fmt --check
            # - name: Build Deno Module
            #   run: deno run --reload mod.ts
            # - name: Run Lint
            #   run: deno task lint
            # - name: Run Test
            #   run: deno task t
            - name: Run Type Check
              run: npm run check
