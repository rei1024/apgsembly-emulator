name: Test

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Git Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: "./.node-version"
      - name: Install dependencies
        run: npm ci
      - name: Run Test
        run: npm run test
      - name: Run Type Check
        run: npm run check
